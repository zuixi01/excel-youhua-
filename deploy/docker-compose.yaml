name: excel-auditor-dev
services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment:
      EXCEL_AUDITOR_DATA: /data
      DATABASE_URL: postgresql+psycopg://excel_auditor:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/excel_auditor
      REDIS_URL: redis://redis:6379/0
      EXCEL_RENDERER_COMMAND: /app/renderer/ExcelRenderer
      S3_BUCKET: excel-auditor
      S3_ENDPOINT_URL: http://minio:9000
      S3_SERVER_SIDE_ENCRYPTION: ""
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - auditor-data:/data
    ports: ["8000:8000"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    command: ["rq", "worker", "--url", "redis://redis:6379/0", "excel-auditor"]
    environment:
      EXCEL_AUDITOR_DATA: /data
      DATABASE_URL: postgresql+psycopg://excel_auditor:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/excel_auditor
      REDIS_URL: redis://redis:6379/0
      EXCEL_RENDERER_COMMAND: /app/renderer/ExcelRenderer
      S3_BUCKET: excel-auditor
      S3_ENDPOINT_URL: http://minio:9000
      S3_SERVER_SIDE_ENCRYPTION: ""
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - auditor-data:/data
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    depends_on:
      api:
        condition: service_healthy
    ports: ["8080:8080"]
    restart: unless-stopped

  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: excel_auditor
      POSTGRES_USER: excel_auditor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U excel_auditor"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.2.1-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes: ["minio-data:/data"]
    ports: ["9000:9000", "9001:9001"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing local/excel-auditor
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

volumes:
  auditor-data:
  postgres-data:
  redis-data:
  minio-data:
