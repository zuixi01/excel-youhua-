name: performance-baselines
on:
  workflow_call:
    inputs:
      require_reference:
        description: Fail when no prior successful main-branch performance artifact exists
        required: false
        default: false
        type: boolean
  workflow_dispatch:
  schedule:
    - cron: "20 19 * * 6"

permissions:
  contents: read
  actions: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - rows: 10000
            columns: 50
            density: 1
            difference_rate: 0.1
            sheets: 1
            max_seconds: 180
            max_rss_mib: 3072
          - rows: 100000
            columns: 100
            density: 0.1
            difference_rate: 0.1
            sheets: 1
            max_seconds: 900
            max_rss_mib: 6144
          - rows: 100000
            columns: 200
            density: 0.05
            difference_rate: 0.5
            sheets: 1
            max_seconds: 900
            max_rss_mib: 6144
          - rows: 100000
            columns: 200
            density: 0.01
            difference_rate: 0.01
            sheets: 1
            max_seconds: 900
            max_rss_mib: 6144
          - rows: 50000
            columns: 50
            density: 0.1
            difference_rate: 0.1
            sheets: 5
            max_seconds: 900
            max_rss_mib: 6144
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12", cache: pip }
      - run: python -m pip install uv==0.12.5
      - run: uv sync --frozen --extra test
      - name: Resolve prior stable performance run
        id: reference
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRE_REFERENCE: ${{ inputs.require_reference && '1' || '0' }}
        run: |
          RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/performance.yml/runs?branch=main&status=success&per_page=20" --jq ".workflow_runs[] | select(.id != ${GITHUB_RUN_ID}) | .id" | head -n 1)"
          if [ -z "$RUN_ID" ] && [ "$REQUIRE_REFERENCE" = "1" ]; then
            echo "A release requires a successful main-branch performance baseline." >&2
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
      - name: Download prior stable scenario
        if: steps.reference.outputs.run_id != ''
        id: compatibility
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.reference.outputs.run_id }}
          ARTIFACT: performance-${{ matrix.rows }}x${{ matrix.columns }}-${{ matrix.sheets }}s-${{ matrix.density }}-${{ matrix.difference_rate }}
          REQUIRE_REFERENCE: ${{ inputs.require_reference && '1' || '0' }}
          RESULT: performance-${{ matrix.rows }}x${{ matrix.columns }}-${{ matrix.sheets }}s-${{ matrix.density }}-${{ matrix.difference_rate }}.json
        run: |
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT" --dir performance-reference
          if jq -e '.benchmark_version == 3' "performance-reference/$RESULT" >/dev/null; then
            echo "compatible=1" >> "$GITHUB_OUTPUT"
          elif [ "$REQUIRE_REFERENCE" = "1" ]; then
            echo "A release requires a benchmark-version 3 performance reference." >&2
            exit 1
          else
            echo "compatible=0" >> "$GITHUB_OUTPUT"
          fi
      - name: Run baseline
        env:
          RUN_PERFORMANCE: "1"
          PERF_ROWS: ${{ matrix.rows }}
          PERF_COLUMNS: ${{ matrix.columns }}
          PERF_DENSITY: ${{ matrix.density }}
          PERF_DIFFERENCE_RATE: ${{ matrix.difference_rate }}
          PERF_SHEETS: ${{ matrix.sheets }}
          PERF_MAX_SECONDS: ${{ matrix.max_seconds }}
          PERF_MAX_RSS_MIB: ${{ matrix.max_rss_mib }}
          PERF_RESULT_PATH: performance-${{ matrix.rows }}x${{ matrix.columns }}-${{ matrix.sheets }}s-${{ matrix.density }}-${{ matrix.difference_rate }}.json
        run: uv run --frozen --extra test python -m pytest tests/performance/test_baseline.py -k configured_workbook -s --junitxml=performance-junit.xml
      - name: Reject regression against prior stable scenario
        if: steps.compatibility.outputs.compatible == '1'
        env:
          RESULT: performance-${{ matrix.rows }}x${{ matrix.columns }}-${{ matrix.sheets }}s-${{ matrix.density }}-${{ matrix.difference_rate }}.json
        run: >-
          uv run --frozen python -m excel_auditor.performance_gate
          --current "$RESULT"
          --reference "performance-reference/$RESULT"
          --time-metric cpu_seconds
          --max-time-ratio 0.25
          --time-slack-seconds 5
          --max-memory-ratio 0.25
          --memory-slack-mib 64
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-${{ matrix.rows }}x${{ matrix.columns }}-${{ matrix.sheets }}s-${{ matrix.density }}-${{ matrix.difference_rate }}
          path: performance-${{ matrix.rows }}x${{ matrix.columns }}-${{ matrix.sheets }}s-${{ matrix.density }}-${{ matrix.difference_rate }}.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-junit-${{ matrix.rows }}x${{ matrix.columns }}-${{ matrix.density }}-${{ matrix.difference_rate }}
          path: performance-junit.xml

  paginated-standard-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install uv==0.12.5
      - run: uv sync --frozen --extra test
      - name: Resolve prior stable performance run
        id: reference
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRE_REFERENCE: ${{ inputs.require_reference && '1' || '0' }}
        run: |
          RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/performance.yml/runs?branch=main&status=success&per_page=20" --jq ".workflow_runs[] | select(.id != ${GITHUB_RUN_ID}) | .id" | head -n 1)"
          if [ -z "$RUN_ID" ] && [ "$REQUIRE_REFERENCE" = "1" ]; then
            echo "A release requires a successful main-branch performance baseline." >&2
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
      - name: Download prior stable pagination scenario
        if: steps.reference.outputs.run_id != ''
        id: compatibility
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.reference.outputs.run_id }}
          REQUIRE_REFERENCE: ${{ inputs.require_reference && '1' || '0' }}
        run: |
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name performance-http-pagination --dir performance-reference
          if jq -e '.benchmark_version == 3' performance-reference/performance-http-pagination.json >/dev/null; then
            echo "compatible=1" >> "$GITHUB_OUTPUT"
          elif [ "$REQUIRE_REFERENCE" = "1" ]; then
            echo "A release requires a benchmark-version 3 pagination reference." >&2
            exit 1
          else
            echo "compatible=0" >> "$GITHUB_OUTPUT"
          fi
      - name: Run paginated standard-source baseline
        env:
          PERF_RUN_HTTP: "1"
          PERF_HTTP_RECORDS: "50000"
          PERF_HTTP_PAGE_SIZE: "500"
          PERF_HTTP_SPILL_AFTER_RECORDS: "10000"
          PERF_HTTP_MAX_SECONDS: "60"
          PERF_HTTP_RESULT_PATH: performance-http-pagination.json
        run: uv run --frozen --extra test python -m pytest tests/performance/test_baseline.py -k paginated_standard_source -s --junitxml=performance-http-junit.xml
      - name: Reject pagination regression against prior stable scenario
        if: steps.compatibility.outputs.compatible == '1'
        run: >-
          uv run --frozen python -m excel_auditor.performance_gate
          --current performance-http-pagination.json
          --reference performance-reference/performance-http-pagination.json
          --time-metric cpu_seconds
          --max-time-ratio 0.50
          --time-slack-seconds 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-http-pagination
          path: |
            performance-http-pagination.json
            performance-http-junit.xml

  maximum-standard-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install uv==0.12.5
      - run: uv sync --frozen --extra test
      - name: Resolve prior maximum-standard reference
        id: reference
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRE_REFERENCE: ${{ inputs.require_reference && '1' || '0' }}
          ARTIFACT: performance-maximum-standard
        run: |
          RUN_ID=""
          for CANDIDATE in $(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/performance.yml/runs?branch=main&status=success&per_page=20" --jq ".workflow_runs[] | select(.id != ${GITHUB_RUN_ID}) | .id"); do
            if gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE}/artifacts" --jq '.artifacts[].name' | grep -Fxq "$ARTIFACT"; then
              RUN_ID="$CANDIDATE"
              break
            fi
          done
          if [ -z "$RUN_ID" ] && [ "$REQUIRE_REFERENCE" = "1" ]; then
            echo "A release requires a successful maximum-standard performance baseline." >&2
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
      - name: Download prior maximum-standard scenario
        if: steps.reference.outputs.run_id != ''
        id: compatibility
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.reference.outputs.run_id }}
          REQUIRE_REFERENCE: ${{ inputs.require_reference && '1' || '0' }}
        run: |
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name performance-maximum-standard --dir performance-reference
          if jq -e '.benchmark_version == 3' performance-reference/performance-maximum-standard.json >/dev/null; then
            echo "compatible=1" >> "$GITHUB_OUTPUT"
          elif [ "$REQUIRE_REFERENCE" = "1" ]; then
            echo "A release requires a benchmark-version 3 maximum-standard reference." >&2
            exit 1
          else
            echo "compatible=0" >> "$GITHUB_OUTPUT"
          fi
      - name: Run 500,000-record comparison baseline
        env:
          PERF_RUN_LARGE_STANDARD: "1"
          PERF_LARGE_STANDARD_RECORDS: "500000"
          PERF_LARGE_EXCEL_ROWS: "99999"
          PERF_LARGE_DIFFERENCE_SPILL: "10000"
          PERF_LARGE_STANDARD_MAX_SECONDS: "900"
          PERF_LARGE_STANDARD_MAX_RSS_MIB: "2048"
          PERF_LARGE_STANDARD_RESULT_PATH: performance-maximum-standard.json
        run: uv run --frozen --extra test python -m pytest tests/performance/test_baseline.py -k maximum_standard_comparison -s --junitxml=performance-maximum-standard-junit.xml
      - name: Reject maximum-standard regression
        if: steps.compatibility.outputs.compatible == '1'
        run: >-
          uv run --frozen python -m excel_auditor.performance_gate
          --current performance-maximum-standard.json
          --reference performance-reference/performance-maximum-standard.json
          --time-metric cpu_seconds
          --max-time-ratio 0.25
          --time-slack-seconds 10
          --max-memory-ratio 0.25
          --memory-slack-mib 64
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-maximum-standard
          path: |
            performance-maximum-standard.json
            performance-maximum-standard-junit.xml

  maximum-managed-service-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install uv==0.12.5
      - run: uv sync --frozen --extra test
      - name: Resolve prior maximum managed-service reference
        id: reference
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRE_REFERENCE: ${{ inputs.require_reference && '1' || '0' }}
          ARTIFACT: performance-maximum-managed-service
        run: |
          RUN_ID=""
          for CANDIDATE in $(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/performance.yml/runs?branch=main&status=success&per_page=20" --jq ".workflow_runs[] | select(.id != ${GITHUB_RUN_ID}) | .id"); do
            if gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE}/artifacts" --jq '.artifacts[].name' | grep -Fxq "$ARTIFACT"; then
              RUN_ID="$CANDIDATE"
              break
            fi
          done
          if [ -z "$RUN_ID" ] && [ "$REQUIRE_REFERENCE" = "1" ]; then
            echo "A release requires a successful maximum managed-service performance baseline." >&2
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
      - name: Download prior maximum managed-service scenario
        if: steps.reference.outputs.run_id != ''
        id: compatibility
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.reference.outputs.run_id }}
          REQUIRE_REFERENCE: ${{ inputs.require_reference && '1' || '0' }}
        run: |
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name performance-maximum-managed-service --dir performance-reference
          if jq -e '.benchmark_version == 3' performance-reference/performance-maximum-managed-service.json >/dev/null; then
            echo "compatible=1" >> "$GITHUB_OUTPUT"
          elif [ "$REQUIRE_REFERENCE" = "1" ]; then
            echo "A release requires a benchmark-version 3 maximum managed-service reference." >&2
            exit 1
          else
            echo "compatible=0" >> "$GITHUB_OUTPUT"
          fi
      - name: Run 500,000-record managed-service pipeline baseline
        env:
          PERF_RUN_LARGE_SERVICE: "1"
          PERF_SERVICE_STANDARD_RECORDS: "500000"
          PERF_SERVICE_EXCEL_ROWS: "99999"
          PERF_SERVICE_PAGE_SIZE: "5000"
          PERF_SERVICE_MAX_SECONDS: "900"
          PERF_SERVICE_MAX_RSS_MIB: "2048"
          PERF_SERVICE_RESULT_PATH: performance-maximum-managed-service.json
        run: uv run --frozen --extra test python -m pytest tests/performance/test_baseline.py -k maximum_managed_service_pipeline -s --junitxml=performance-maximum-managed-service-junit.xml
      - name: Reject maximum managed-service regression
        if: steps.compatibility.outputs.compatible == '1'
        run: >-
          uv run --frozen python -m excel_auditor.performance_gate
          --current performance-maximum-managed-service.json
          --reference performance-reference/performance-maximum-managed-service.json
          --time-metric cpu_seconds
          --max-time-ratio 0.25
          --time-slack-seconds 15
          --max-memory-ratio 0.25
          --memory-slack-mib 96
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-maximum-managed-service
          path: |
            performance-maximum-managed-service.json
            performance-maximum-managed-service-junit.xml
