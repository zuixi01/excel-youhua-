name: ci
on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "${{ matrix.python-version }}"
          cache: pip
      - run: python -m pip install uv==0.12.5
      - run: uv sync --frozen --extra test
      - run: uv run --frozen --extra test python -m pytest --junitxml=junit-${{ matrix.python-version }}.xml --cov=excel_auditor --cov-report=xml:coverage-${{ matrix.python-version }}.xml --cov-report=term
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: python-test-evidence-${{ matrix.python-version }}
          path: |
            junit-${{ matrix.python-version }}.xml
            coverage-${{ matrix.python-version }}.xml

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with: { version: 9.15.9 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "22.22.3", cache: pnpm, cache-dependency-path: apps/web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  renderer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with: { dotnet-version: "8.0.424" }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - run: dotnet restore services/excel_renderer/ExcelRenderer.csproj --locked-mode --nologo
      - run: dotnet publish services/excel_renderer/ExcelRenderer.csproj -c Release -r win-x64 --self-contained true --no-restore -o renderer-win --nologo
      - run: python -m pip install uv==0.12.5 && uv sync --frozen --extra test
      - name: Renderer contract test
        shell: pwsh
        run: |
          $env:EXCEL_RENDERER_COMMAND = (Resolve-Path "renderer-win/ExcelRenderer.exe").Path
          uv run --frozen --extra test python -m pytest tests/test_dotnet_renderer.py --junitxml=renderer-junit.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: excel-renderer-win-x64-${{ github.event.pull_request.head.sha || github.sha }}
          path: renderer-win
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: renderer-test-evidence
          path: renderer-junit.xml

  libreoffice-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with: { dotnet-version: "8.0.424" }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.14" }
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-calc
      - run: dotnet restore services/excel_renderer/ExcelRenderer.csproj --locked-mode --nologo
      - run: dotnet publish services/excel_renderer/ExcelRenderer.csproj -c Release -r linux-x64 --self-contained true --no-restore -o .renderer --nologo
      - run: python -m pip install uv==0.12.5 && uv sync --frozen --extra test
      - name: LibreOffice open and resave contract
        env:
          EXCEL_RENDERER_COMMAND: ${{ github.workspace }}/.renderer/ExcelRenderer
          LIBREOFFICE_COMMAND: soffice
        run: uv run --frozen --extra test python -m pytest tests/test_dotnet_renderer.py -k libreoffice --junitxml=libreoffice-junit.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: libreoffice-test-evidence
          path: libreoffice-junit.xml

  infrastructure-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine3.23
        env:
          POSTGRES_DB: auditor
          POSTGRES_USER: auditor
          POSTGRES_PASSWORD: auditor
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U auditor -d auditor"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:8.8.0-alpine3.23
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with: { dotnet-version: "8.0.424" }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.14" }
      - name: Start pinned MinIO
        run: |
          docker run --detach --name minio-integration \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          for attempt in $(seq 1 30); do curl --fail --silent http://127.0.0.1:9000/minio/health/ready >/dev/null && exit 0; sleep 2; done
          docker logs minio-integration
          exit 1
      - run: dotnet restore services/excel_renderer/ExcelRenderer.csproj --locked-mode --nologo
      - run: dotnet publish services/excel_renderer/ExcelRenderer.csproj -c Release -r linux-x64 --self-contained true --no-restore -o .renderer --nologo
      - run: python -m pip install uv==0.12.5 && uv sync --frozen --extra test
      - name: Run real infrastructure pipeline
        env:
          RUN_INFRA_INTEGRATION: "1"
          INTEGRATION_DATABASE_URL: postgresql+psycopg://auditor:auditor@127.0.0.1:5432/auditor
          INTEGRATION_REDIS_URL: redis://127.0.0.1:6379/0
          INTEGRATION_S3_ENDPOINT: http://127.0.0.1:9000
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
          AWS_DEFAULT_REGION: us-east-1
          EXCEL_RENDERER_COMMAND: ${{ github.workspace }}/.renderer/ExcelRenderer
        run: uv run --frozen --extra test python -m pytest tests/test_infrastructure_integration.py -q --junitxml=infrastructure-junit.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: infrastructure-test-evidence
          path: infrastructure-junit.xml

  dependency-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12", cache: pip }
      - run: python -m pip install uv==0.12.5
      - run: uv sync --frozen --extra security
      - name: Python vulnerability audit
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file audit-requirements.txt
          uv run --frozen --extra security pip-audit --strict -r audit-requirements.txt
      - name: Python license inventory
        run: uv run --frozen --extra security pip-licenses --format=json --output-file=python-licenses.json
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with: { version: 9.15.9 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "22.22.3", cache: pnpm, cache-dependency-path: apps/web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web
      - run: pnpm audit --audit-level high
        working-directory: apps/web
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with: { dotnet-version: "8.0.424" }
      - run: dotnet restore services/excel_renderer/ExcelRenderer.csproj --locked-mode --nologo
      - name: .NET vulnerability audit
        run: |
          dotnet list services/excel_renderer/ExcelRenderer.csproj package --vulnerable --include-transitive --format json > dotnet-vulnerabilities.json
          python - <<'PY'
          import json
          payload = json.load(open("dotnet-vulnerabilities.json", encoding="utf-8"))
          findings = []
          def walk(value):
              if isinstance(value, dict):
                  for key, child in value.items():
                      if key == "vulnerabilities" and child:
                          findings.extend(child)
                      walk(child)
              elif isinstance(value, list):
                  for child in value:
                      walk(child)
          walk(payload)
          if findings:
              raise SystemExit(f"vulnerable NuGet packages found: {findings}")
          PY
      - name: Generate repository SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: repository.spdx.json
          upload-artifact: false
      - name: Scan repository dependencies
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # immutable v7.4.0
        with:
          path: .
          fail-build: true
          severity-cutoff: high
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-governance
          path: |
            python-licenses.json
            repository.spdx.json
            dotnet-vulnerabilities.json
